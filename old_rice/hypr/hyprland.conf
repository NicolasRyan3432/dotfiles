# ARQUIVOS DE CONFIGURÇÃO DO HYPRLAND.
# FOI DIVIDIDO EM MÓDULOS

# Configuração de monitor
source = ~/.config/hypr/modules/monitors.conf

# Configuração de entrada
source = ~/.config/hypr/modules/input.conf

# Configuração de variáveis de programas (wofi, cliphist...)
source = ~/.config/hypr/modules/programs.conf

# Configuração de coisas que iniciam junto com o sistema
source = ~/.config/hypr/modules/autostart.conf

# Configuração de váriaveis de sistema
source = ~/.config/hypr/modules/variables.conf

# Configuração de permissões
source = ~/.config/hypr/modules/permissions.conf

# Configuração da aparência das janelas e das transições.
# Talvez terá que modificar esse daqui ainda
source = ~/.config/hypr/modules/look.conf

# Configuração das keybinds
source = ~/.config/hypr/modules/binds.conf

# Configuração do comportamento de janelas.
source = ~/.config/hypr/modules/windowrules.conf
